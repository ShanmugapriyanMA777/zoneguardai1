version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zoneguard-backend
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=true
      - REAL_DATA_MODE=false
      - DATABASE_URL=sqlite:///./zoneguard.db
      - SECRET_KEY=zoneguard-sih-2026-production-key
    volumes:
      - ./backend/zoneguard.db:/app/zoneguard.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zoneguard-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

